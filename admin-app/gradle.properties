org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true

# API URLs are not secrets, but never put JWT/TURN credentials in this file.
# Debug (emulator → host): -Parl.debugApiBaseUrl=http://10.0.2.2:8080
# Optional Target-facing pairing URL if backend LAN detect is wrong:
# arl.pairingApiBaseUrl=http://10.59.57.35:8080
# Release (HTTPS Render URL): -Parl.releaseApiBaseUrl=https://your-service.onrender.com
# arl.debugApiBaseUrl=http://10.0.2.2:8080
# arl.releaseApiBaseUrl=https://api.example.invalid
